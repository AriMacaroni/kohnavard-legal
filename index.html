<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kohnavard — Legal</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4f6f1;
        color: #1a1f16;
        line-height: 1.55;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      h1 {
        color: #2f5d3a;
      }
      a {
        color: #2f5d3a;
      }
      .card {
        background: #fff;
        border: 1px solid #d5ddd0;
        border-radius: 12px;
        padding: 1rem 1.15rem;
        margin: 1rem 0;
      }
      .video-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #1a1f16;
        border-radius: 8px;
        overflow: hidden;
      }
      .video-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kohnavard</h1>
      <p>Legal pages for the Kohnavard app.</p>
      <div class="card">
        <p><strong>Viamici, coming soon...</strong></p>
        <div class="video-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/24m0hyvjBJs"
            title="Viamici, coming soon..."
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
      </div>
      <div class="card">
        <p><a href="./privacy.html">Privacy Policy</a></p>
        <p><a href="./account-deletion.html">Delete your account</a></p>
      </div>
      <p>Contact: <a href="mailto:kohnavard.app@gmail.com">kohnavard.app@gmail.com</a></p>
    </main>
  </body>
</html>
